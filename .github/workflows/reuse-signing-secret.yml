name: Reuse existing iOS signing secret
on:
  push:
    branches: ['chore/reuse-ios-signing-20261123']
    paths: ['.github/workflows/reuse-signing-secret.yml']
permissions: {}
jobs:
  seal:
    if: github.repository == 'tsekimoto/nanpure-ios' && github.actor == 'tsekimoto' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Seal existing password for owner-controlled destination
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const {publicEncrypt} = require('node:crypto');
          const {writeFileSync} = require('node:fs');
          const key = "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqCkxk7dGYTmf8Hg0T6ep\n4u5lEeVSFpOsjyX68jcczo9CpcL8BfTe934/+1OCF+/sbLKp4Az1HbaHnkPBOIOC\nzrj+Z7kneonReQ4yQ7ENurcs9ADghIpi2avFxWtlqPPQA3r5s7EFx+3HPrxIt2pL\nT/UdZzZ308ATUFm1ZbeNGFQ1+OLm46D5inEOnBRZKUTzjekFHZ4UAE+eIZtSCK6c\nHXOxozEPRSXkTSmBAFrmmXOxIqJUfUyIzdKIYUi2h+oED3wzvWfxpCX97MCWsUHh\nOYEVuN8X1za6fGiWum6qKv7XLAmvONlr6p+IJ1J6rSNiYkDptmmWHaKdYWlfBWKE\n9lJmZyQnLhfnXtUZ6gYgnmp27XviVj9PBwrXFf1rQVjLcQl8xvFF8DrYhwM0xd4d\nEp2+xRwTaSy3qXZDU5z+A6o4NEcBR6lYlcg0C7CXFYfxExnwOW47W8KHMFN/MzjO\nBL9kU6Vg7k8a07SvEbV9nsvze4myPvkhczKNSH7oUZKL1gSbmd0BXF7nM8o2mg7R\nc2t0RxCN1APXwfS2EzVbcdaLLCaWob9Eg88LrEvpCjbv8jaK7L12+NGOOXPkfIDW\nGNgvcHE7I82pQC4o+hp3TlgBgjR5ij+Sqfs8Zf41VK0Z7TjTa2p/AKpgvXx7MB0d\ntjCD00+32nxqi2pGc9H6igUCAwEAAQ==\n-----END PUBLIC KEY-----";
          const plain = Buffer.from(process.env.P12_PASSWORD || '', 'utf8');
          delete process.env.P12_PASSWORD;
          if (plain.length === 0 || plain.length > 446) {
            plain.fill(0);
            throw new Error('Signing password unavailable or exceeds sealed transfer limit');
          }
          try {
            const sealed = publicEncrypt({key, oaepHash:'sha256'}, plain);
            writeFileSync(process.env.RUNNER_TEMP + '/sealed-signing-password.bin', sealed, {mode:0o600});
          } finally {
            plain.fill(0);
          }
          NODE
      - name: Keep encrypted transfer briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-signing-password
          path: ${{ runner.temp }}/sealed-signing-password.bin
          if-no-files-found: error
          retention-days: 1
