name: Reuse existing iOS signing secret
on:
  push:
    branches: ['chore/reuse-ios-signing-20261123']
    paths: ['.github/workflows/reuse-signing-secret.yml']
permissions: {}
jobs:
  seal:
    if: github.repository == 'tsekimoto/nanpure-ios' && github.actor == 'tsekimoto' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Seal existing password for owner-controlled destination
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const {publicEncrypt} = require('node:crypto');
          const {writeFileSync} = require('node:fs');
          const key = "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAk/vJn9ohKTfcpkQeDTxC\nrzeytqcShB4K+J5UFNEodjA5Nd8vIRuYUW7HkDEQxeNajUxUi1MsQSjsLS6q5GIh\nggONCm1jQKtnrubiQc7U18AMh3lFDNyLvjmebSeMERjdkz8up3ZJgnKW0CThYKsv\ndAIWM7FHfAco1CKZkEt1PN4uBvN/Mi6bhj9ibPHfFS0Wt6Z7f1VmbbuZMeqPKpZv\nnCDm29BMcN5R0qyPUESccEfcUe5wrIebg+LkLoebKPPvDVytmzR33zCh8OiAFJf/\n6jFTNBENctKP+JdF/dk19XlnlX5DDMlKjYuE6JBbDQUlqjrQd1oLadXSs94TXW+H\ndCwPEXOw3BAOp9ch0kikkSU5tRHjttfRPja4lAJTH0dzoTu7BBt07RhTqNrIhBtY\njuxdqqDxJvDKOFo1T+8Z6RLN0H0FlGvT99i15nZIXU/vV5kkURkC77m2lY4B8m9p\nfIUoR+xmAp7aFNnYZKPL841rSleP2c6PssHDCOb4pRLlijWTr5GBPCjmOvYihbL6\nt7fjLNtkaQs1MGg2pskng6BcDMWpiiWeVUIsY3D4vH6e4pxM3/CKRYC8I+A51eDj\n30DjwXQ3Srh7gSf9KGxwcWrlm1LMTezpm23MMwpEHyDPu6yv+78p3LV/I/3J5SpU\nm+jt25BPxWAF+bKskoKxLIUCAwEAAQ==\n-----END PUBLIC KEY-----";
          const plain = Buffer.from(process.env.P12_PASSWORD || '', 'utf8');
          delete process.env.P12_PASSWORD;
          if (plain.length === 0 || plain.length > 446) {
            plain.fill(0);
            throw new Error('Signing password unavailable or exceeds sealed transfer limit');
          }
          try {
            const sealed = publicEncrypt({key, oaepHash:'sha256'}, plain);
            writeFileSync(process.env.RUNNER_TEMP + '/sealed-signing-password.bin', sealed, {mode:0o600});
          } finally {
            plain.fill(0);
          }
          NODE
      - name: Keep encrypted transfer briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-signing-password
          path: ${{ runner.temp }}/sealed-signing-password.bin
          if-no-files-found: error
          retention-days: 1
