name: Verify iOS App

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check distribution scripts without credentials
        run: |
          /bin/bash -n scripts/archive-app.sh scripts/upload-app.sh
          python3 -m unittest discover -s tests -v
      - name: Build Debug without signing
        run: |
          xcodebuild build -project "src/ナンプレ.xcodeproj" -scheme Nanpure \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/verify-debug" CODE_SIGNING_ALLOWED=NO
      - name: Build Release without signing
        run: |
          xcodebuild build -project "src/ナンプレ.xcodeproj" -scheme Nanpure \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/verify-release" CODE_SIGNING_ALLOWED=NO
